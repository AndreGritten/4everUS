<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4everUS - Login</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Seu CSS -->
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="container-fluid min-vh-100">
        <div class="row min-vh-100">

            <!-- Lado esquerdo - imagem -->
            <div class="col-md-6 d-none d-md-block p-0">
                <div class="bg-image d-flex align-items-center justify-content-center">
                    <div class="text-center text-light px-4">
                        <h1 class="fw-bold">Bem-vindo ao 4everUS 💜</h1>
                        <p class="lead mt-3">
                            Um site de gerenciamento de relacionamentos.<br>
                            Guarde aqui sua história e aprimore a experiência com o mozão.
                        </p>
                    </div>
                </div>
            </div>


            <!-- Lado direito - login -->
            <div class="col-md-6 d-flex align-items-center justify-content-center bg-transparent">
                <div class="card custom-card text-center">
                    <img src="../assets/img/logo.png" class="card-img-top" alt="Logo 4everUS">
                    <h1 class="card-title mb-3">4everUS</h1>
                    <div class="card-body">
                        <h5 class="mb-3">Login</h5>
                        <form>
                            <div class="mb-3 text-start">
                                <label for="email" class="form-label">E-mail</label>
                                <input type="email" class="form-control" id="email" placeholder="Digite seu e-mail">
                            </div>
                            <div class="mb-3 text-start">
                                <label for="password" class="form-label">Senha</label>
                                <input type="password" class="form-control" id="password" placeholder="Digite sua senha">
                            </div>
                            <div class="form-check mb-3 text-start">
                                <input type="checkbox" class="form-check-input" id="remember">
                                <label class="form-check-label" for="remember">Lembre de mim</label>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 mb-2">Fazer login</button>
                        </form>

                        <button type="button" class="btn btn-outline-light w-100" data-bs-toggle="modal" data-bs-target="#modalCadastro">
                            Não tem login? Cadastre-se!
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de Cadastro -->
    <div class="modal fade" id="modalCadastro" tabindex="-1" aria-labelledby="modalCadastroLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content p-3">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="modalCadastroLabel">Crie sua conta no 4everUS 💜</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>
                <div class="modal-body">
                    <form>
                        <div class="mb-3">
                            <label for="nomeCompleto" class="form-label">Seu nome completo</label>
                            <input type="text" class="form-control" id="nomeCompleto" placeholder="Ex: André Gritten">
                        </div>

                        <div class="mb-3">
                            <label for="genero" class="form-label">Seu gênero</label>
                            <select class="form-select" id="genero">
                                <option selected disabled>Selecione</option>
                                <option value="masculino">Masculino</option>
                                <option value="feminino">Feminino</option>
                                <option value="outro">Outro</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="parceiro" class="form-label">Nome do(a) parceiro(a)</label>
                            <input type="text" class="form-control" id="parceiro" placeholder="Ex: Nayhara Lara">
                        </div>

                        <div class="mb-3">
                            <label for="generoParceiro" class="form-label">Gênero do(a) parceiro(a)</label>
                            <select class="form-select" id="generoParceiro">
                                <option selected disabled>Selecione</option>
                                <option value="masculino">Masculino</option>
                                <option value="feminino">Feminino</option>
                                <option value="outro">Outro</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="emailCadastro" class="form-label">E-mail</label>
                            <input type="email" class="form-control" id="emailCadastro" placeholder="Digite seu e-mail">
                        </div>

                        <div class="row">
                            <div class="col mb-3">
                                <label for="senha" class="form-label">Senha</label>
                                <input type="password" class="form-control" id="senha" placeholder="********">
                            </div>
                            <div class="col mb-3">
                                <label for="confirmaSenha" class="form-label">Confirmar senha</label>
                                <input type="password" class="form-control" id="confirmaSenha" placeholder="********">
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 mt-2">Criar conta</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
