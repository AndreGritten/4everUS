<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>4everUS - Login</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="container-fluid vh-100 d-flex p-0">
    <div class="row flex-fill m-0 w-100">

      <!-- Lado esquerdo - imagem -->
      <div class="col-md-6 d-none d-md-flex align-items-center justify-content-center p-0">
        <div class="bg-image d-flex align-items-center justify-content-center">
          <div class="text-center text-light px-4">
            <h1 class="fw-bold">Bem-vindo ao 4everUS 💜</h1>
            <p class="lead mt-3">
              Um site de gerenciamento de relacionamentos.<br>
              Guarde aqui sua história e aprimore a experiência com o mozão.
            </p>
          </div>
        </div>
      </div>

      <!-- Lado direito - card flip -->
      <div class="col-12 col-md-6 d-flex align-items-center justify-content-center p-0">
        <div class="flip-container">
          <div class="flipper" id="flipper">

            <!-- Frente (Login) -->
            <div class="front card custom-card text-center">
              <div class="card-body d-flex flex-column justify-content-center">
                <img src="../assets/img/logo.png" class="card-img-top mx-auto mb-2" alt="Logo 4everUS" style="width:80px;">
                <h1 class="card-title mb-3">4everUS</h1>
                <h5 class="mb-3">Login</h5>
                <form id="loginForm">
                  <div class="mb-3 text-start">
                    <label for="email" class="form-label">E-mail</label>
                    <input type="email" class="form-control" id="email" placeholder="Digite seu e-mail" required>
                  </div>
                  <div class="mb-3 text-start">
                    <label for="password" class="form-label">Senha</label>
                    <input type="password" class="form-control" id="password" placeholder="Digite sua senha" required>
                  </div>
                  <div class="form-check mb-3 text-start">
                    <input type="checkbox" class="form-check-input" id="remember">
                    <label class="form-check-label" for="remember">Lembre de mim</label>
                  </div>
                  <button type="submit" class="btn btn-primary w-100 mb-2">Fazer login</button>
                </form>
                <button type="button" class="btn btn-outline-light w-100" onclick="flipCard()">Não tem login? Cadastre-se!</button>
              </div>
            </div>

            <!-- Verso (Cadastro) -->
            <div class="back card custom-card text-center">
              <div class="card-body d-flex flex-column justify-content-center">
                <h2 class="mb-3">Crie sua conta 💜</h2>
                <form id="registerForm">
                  <div class="mb-3 text-start">
                    <label for="nomeCompleto" class="form-label">Seu nome completo</label>
                    <input type="text" class="form-control" id="nomeCompleto" placeholder="Ex: André Gritten" required>
                  </div>

                  <div class="mb-3 text-start">
                    <label for="genero" class="form-label">Seu gênero</label>
                    <select class="form-select" id="genero" required>
                      <option selected disabled>Selecione</option>
                      <option>Masculino</option>
                      <option>Feminino</option>
                      <option>Outro</option>
                    </select>
                  </div>

                  <div class="mb-3 text-start">
                    <label for="parceiro" class="form-label">Nome do(a) parceiro(a)</label>
                    <input type="text" class="form-control" id="parceiro" placeholder="Ex: Nayhara Lara" required>
                  </div>

                  <div class="mb-3 text-start">
                    <label for="generoParceiro" class="form-label">Gênero do(a) parceiro(a)</label>
                    <select class="form-select" id="generoParceiro" required>
                      <option selected disabled>Selecione</option>
                      <option>Masculino</option>
                      <option>Feminino</option>
                      <option>Outro</option>
                    </select>
                  </div>

                  <div class="mb-3 text-start">
                    <label for="emailCadastro" class="form-label">E-mail</label>
                    <input type="email" class="form-control" id="emailCadastro" placeholder="Digite seu e-mail" required>
                  </div>

                  <div class="row">
                    <div class="col mb-3 text-start">
                      <label for="senha" class="form-label">Senha</label>
                      <input type="password" class="form-control" id="senha" placeholder="********" required>
                    </div>
                    <div class="col mb-3 text-start">
                      <label for="confirmaSenha" class="form-label">Confirmar senha</label>
                      <input type="password" class="form-control" id="confirmaSenha" placeholder="********" required>
                    </div>
                  </div>

                  <button type="submit" class="btn btn-primary w-100 mt-2">Criar conta</button>
                  <button type="button" class="btn btn-outline-light w-100 mt-2" onclick="flipCard()">Voltar ao Login</button>
                </form>
              </div>
            </div>

          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/main.js"></script>
</body>
</html>
